<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Compra">
<meta name="theme-color" content="#FFFFFF">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Compra</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
:root{--bg:#FFFFFF;--card:#FFFFFF;--ink:#111111;--mute:#707070;--bd:#DDDDDD;--line:#ECECEC;--acc:#0E8F4A;--acc-soft:#E3F4E8;--acc-ink:#0A6B37;--onacc:#FFFFFF;--sel:#F6F6F6;--tom:#E2342B;--ontom:#FFFFFF;--good:#0E8F4A;--ongood:#FFFFFF;--glass:rgba(255,255,255,.95);--sh:none;--tile:#F1F5EE;--ring:rgba(0,0,0,.2);--tabsel:#0E8F4A;--tabselfg:#FFFFFF;--sun:var(--acc-soft);--mint:var(--acc);--lime:var(--acc);--shc:transparent;--tbb:var(--glass);--tbf:var(--mute);--bw:1px;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0B0B0B;--card:#0B0B0B;--ink:#F2F2F2;--mute:#9A9A9A;--bd:#2B2B2B;--line:#1E1E1E;--acc:#3FD07F;--acc-soft:#14261B;--acc-ink:#3FD07F;--onacc:#0B0B0B;--sel:#151515;--tom:#FF6B6B;--ontom:#1A0000;--good:#6FD39A;--ongood:#04140A;--glass:rgba(11,11,11,.95);--sh:none;--tile:#17211B;--ring:rgba(255,255,255,.2);--tabsel:#3FD07F;--tabselfg:#04140A}}
:root[data-theme="dark"]{--bg:#0B0B0B;--card:#0B0B0B;--ink:#F2F2F2;--mute:#9A9A9A;--bd:#2B2B2B;--line:#1E1E1E;--acc:#3FD07F;--acc-soft:#14261B;--acc-ink:#3FD07F;--onacc:#0B0B0B;--sel:#151515;--tom:#FF6B6B;--ontom:#1A0000;--good:#6FD39A;--ongood:#04140A;--glass:rgba(11,11,11,.95);--sh:none;--tile:#17211B;--ring:rgba(255,255,255,.2);--tabsel:#3FD07F;--tabselfg:#04140A}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:500 16px/1.4 "DM Sans",system-ui,sans-serif;min-height:100vh}
button,input,select{font-family:inherit}
:focus-visible{outline:3px solid var(--tom);outline-offset:3px}
.wrap{max-width:600px;margin:0 auto;padding:0 16px 160px}
header{padding:22px 0 10px;display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
h1{font:800 48px/.95 "Bricolage Grotesque",system-ui,sans-serif;margin:0;letter-spacing:-.04em}
.sub{display:inline-block;margin-top:10px;background:var(--sun);color:#111;border:var(--bw) solid var(--ink);border-radius:10px;padding:2px 10px;font:700 12px "DM Sans",system-ui,sans-serif;transform:rotate(-2deg)}
.sync{flex:none;border:var(--bw) solid var(--ink);background:var(--card);color:var(--ink);border-radius:999px;padding:6px 12px;font:700 12px "DM Sans",system-ui,sans-serif;display:flex;align-items:center;gap:6px;cursor:pointer;margin-top:6px}
.sync i{width:10px;height:10px;border-radius:50%;background:var(--mute);border:2px solid var(--ink)}
.sync.ok i{background:var(--mint)}.sync.off i{background:var(--tom)}
.search{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:10px 0 12px;display:flex;gap:10px}
.search input,.search select,.addc input,.addc select,.jrow input,.jb input{border:var(--bw) solid var(--ink);background:var(--card);color:var(--ink);border-radius:16px;padding:13px 15px;font:700 16px "DM Sans",system-ui,sans-serif;outline:none;min-width:0;box-shadow:3px 3px 0 var(--shc)}
.search input{flex:1}.search select{flex:none;max-width:38%}
.search input:focus,.addc input:focus,.jb input:focus{box-shadow:3px 3px 0 var(--tom)}
.adding{width:100%;display:flex;justify-content:space-between;align-items:center;gap:10px;border:var(--bw) solid var(--ink);background:var(--sun);color:#111;border-radius:18px;padding:12px 14px;font:700 14px "DM Sans",system-ui,sans-serif;cursor:pointer;margin:2px 0 8px;text-align:left;box-shadow:4px 4px 0 var(--shc)}
.adding .c{background:#111;color:var(--sun);border-radius:999px;padding:1px 10px;font-weight:800}
.h2{display:inline-block;font:800 22px "Bricolage Grotesque",system-ui,sans-serif;margin:22px 2px 12px;letter-spacing:-.02em;background:linear-gradient(transparent 58%,var(--sun) 58%);color:var(--ink)}
.cats{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.cat{aspect-ratio:1.18;border:var(--bw) solid var(--ink);border-radius:26px;background:var(--c);color:#111;padding:12px 14px;display:flex;flex-direction:column;justify-content:space-between;align-items:flex-start;text-align:left;cursor:pointer;box-shadow:5px 5px 0 var(--shc);transform:rotate(var(--r));transition:transform .12s,box-shadow .12s}
.cat:active{transform:translate(4px,4px) rotate(var(--r));box-shadow:1px 1px 0 var(--shc)}
.cat .ti{display:inline-block;font-size:46px;line-height:1;transform:rotate(-10deg)}
.cat b{display:block;font:800 17px/1.1 "Bricolage Grotesque",system-ui,sans-serif;letter-spacing:-.01em}
.cat small{display:inline-block;margin-top:6px;background:#111;color:#fff;border-radius:999px;padding:1px 9px;font:700 11px "DM Sans",system-ui,sans-serif}
.rhead{display:flex;align-items:center;gap:12px;margin:8px 0 14px}
.rhead h2{font:800 24px/1.1 "Bricolage Grotesque",system-ui,sans-serif;margin:0;letter-spacing:-.02em}
.back{flex:none;width:44px;height:44px;border-radius:14px;border:var(--bw) solid var(--ink);background:var(--card);color:var(--ink);font-size:26px;line-height:1;cursor:pointer;box-shadow:3px 3px 0 var(--shc)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
@media(min-width:520px){.grid{grid-template-columns:repeat(3,1fr)}}
.p{position:relative;text-align:left;border:var(--bw) solid var(--ink);background:var(--card);color:var(--ink);border-radius:22px;padding:9px 9px 11px;box-shadow:4px 4px 0 var(--shc);cursor:pointer;font:inherit;display:flex;flex-direction:column;gap:4px;transition:transform .1s,box-shadow .1s}
.p:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--shc)}
.im{height:112px;border-radius:14px;background:#fff;border:2px solid var(--ink);display:grid;place-items:center;overflow:hidden;margin-bottom:6px}
.im img{width:100%;height:100%;object-fit:contain}
.im span{font-size:40px}
.br{font-weight:800;font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--tom)}
.p b{font-weight:800;font-size:14px;line-height:1.15}
.p small{color:var(--mute);font-size:12px;font-weight:500}
.pr{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:auto;padding-top:6px}
.pr strong{background:var(--sun);color:#111;border:2px solid var(--ink);border-radius:9px;padding:0 8px;font:800 17px "Bricolage Grotesque",system-ui,sans-serif;transform:rotate(-2deg)}
.pr em{font:500 11px "DM Sans",system-ui,sans-serif;color:var(--mute);font-style:normal}
.dl{font:800 11px "DM Sans",system-ui,sans-serif;font-style:normal;border-radius:999px;padding:1px 7px;border:2px solid var(--ink);color:#111}
.dl.up{background:var(--tom)}.dl.dn{background:var(--mint)}
.tick{position:absolute;top:14px;right:14px;width:32px;height:32px;border-radius:10px;background:var(--card);border:var(--bw) solid var(--ink);display:grid;place-items:center;color:#111;font-weight:800;font-size:18px}
.on{background:var(--sel)!important}
.on .tick{background:var(--lime);transform:rotate(-6deg)}
.pop .tick{animation:stamp .32s cubic-bezier(.3,1.6,.5,1)}
@keyframes stamp{0%{transform:scale(2.4) rotate(-25deg);opacity:0}100%{transform:scale(1) rotate(-6deg);opacity:1}}
.minis{display:flex;gap:12px;overflow-x:auto;padding:2px 6px 14px 2px;scrollbar-width:none}
.minis::-webkit-scrollbar{display:none}
.mini{position:relative;flex:none;width:104px;border:var(--bw) solid var(--ink);background:var(--card);border-radius:20px;padding:7px;text-align:center;font:700 12px/1.15 "DM Sans",system-ui,sans-serif;color:var(--ink);cursor:pointer;box-shadow:3px 3px 0 var(--shc)}
.mini .im{height:68px;margin-bottom:6px}
.mini .nn{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.mini .tick{top:12px;right:12px;width:24px;height:24px;font-size:14px;border-radius:8px}
.mini .xn{position:absolute;top:12px;left:12px;background:#111;color:var(--lime);border-radius:999px;font:800 10px "DM Sans",system-ui,sans-serif;padding:1px 6px}
.empty{text-align:center;color:var(--mute);padding:34px 12px}
.empty .big{font-size:56px;margin-bottom:8px}
.empty b{display:block;color:var(--ink);font:800 22px "Bricolage Grotesque",system-ui,sans-serif;margin-bottom:6px;letter-spacing:-.02em}
.empty p{margin:0 0 16px}
.acts{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
#more{height:1px}
.btn{border:var(--bw) solid var(--ink);background:var(--card);color:var(--ink);border-radius:16px;padding:12px 16px;font:800 14px "DM Sans",system-ui,sans-serif;cursor:pointer;box-shadow:3px 3px 0 var(--shc);transition:transform .1s,box-shadow .1s}
.btn:active{transform:translate(3px,3px);box-shadow:0 0 0 var(--shc)}
.btn.pri{background:var(--lime);color:#111}
.btn.ghost{background:transparent;box-shadow:none;color:var(--mute);border-color:transparent;text-decoration:underline}
.btn.wide{width:100%}
.btn.big{width:100%;padding:18px;font:800 19px "Bricolage Grotesque",system-ui,sans-serif;border-radius:22px;box-shadow:5px 5px 0 var(--shc);letter-spacing:-.01em}
.prog{background:var(--card);border:var(--bw) solid var(--ink);border-radius:24px;padding:14px 16px 18px;box-shadow:5px 5px 0 var(--shc);margin:6px 0 14px}
.pt{display:flex;align-items:baseline;gap:8px;margin-bottom:12px}
.pt b{font:800 28px "Bricolage Grotesque",system-ui,sans-serif;letter-spacing:-.03em}
.pt span{color:var(--mute);font-size:14px;font-weight:700}
.pt em{margin-left:auto;font:800 18px "Bricolage Grotesque",system-ui,sans-serif;font-style:normal;background:var(--sun);color:#111;border:2px solid var(--ink);border-radius:10px;padding:0 9px;transform:rotate(2deg)}
.trk{position:relative;margin:30px 12px 0 8px}
.tkin{height:16px;border-radius:999px;border:var(--bw) solid var(--ink);background:var(--card);overflow:hidden}
.tkin i{display:block;height:100%;background:var(--lime);transition:width .35s}
.cart{position:absolute;top:2px;font-size:26px;transform:translate(-50%,-92%) scaleX(-1);transition:left .35s;pointer-events:none}
.tools{display:flex;gap:10px;margin-bottom:12px}
.tools .btn{flex:1;font-size:13px;padding:11px 8px}
.addc{display:grid;grid-template-columns:1fr auto;gap:8px;margin-bottom:6px}
.addc select{grid-column:1/-1;font-size:14px;padding:10px 12px}
.gh{display:flex;align-items:center;gap:8px;margin:22px 2px 10px;font:800 18px "Bricolage Grotesque",system-ui,sans-serif;letter-spacing:-.02em}
.gh span:first-child{font-size:24px;display:inline-block;transform:rotate(-8deg)}
.gh em{margin-left:auto;font:800 12px "DM Sans",system-ui,sans-serif;font-style:normal;background:var(--ink);color:var(--bg);border-radius:999px;padding:1px 9px}
.gh .mv{display:flex;gap:6px;margin-left:auto}
.gh .mv button{width:38px;height:38px;border-radius:12px;border:var(--bw) solid var(--ink);background:var(--card);color:var(--ink);font:800 16px "DM Sans",system-ui,sans-serif;cursor:pointer;box-shadow:2px 2px 0 var(--shc)}
.row{display:flex;align-items:center;gap:11px;background:var(--card);border:var(--bw) solid var(--ink);border-radius:20px;padding:9px 11px;margin-bottom:10px;box-shadow:3px 3px 0 var(--shc);cursor:pointer;min-height:72px;user-select:none;-webkit-user-select:none}
.ck{flex:none;width:34px;height:34px;border-radius:11px;border:var(--bw) solid var(--ink);background:var(--card);display:grid;place-items:center;color:#111;font-weight:800;font-size:19px}
.row.done{background:var(--sel)}
.row.done .ck{background:var(--lime);animation:stamp .32s cubic-bezier(.3,1.6,.5,1)}
.row.done .nm b{text-decoration:line-through;text-decoration-thickness:2.5px}
.row.done .th,.row.done .nm{opacity:.6}
.th{flex:none;width:50px;height:50px;border-radius:12px;background:#fff;border:2px solid var(--ink);display:grid;place-items:center;overflow:hidden}
.th img{width:100%;height:100%;object-fit:contain}
.th span{font-size:24px}
.nm{flex:1;min-width:0;line-height:1.2}
.nm b{font-weight:800;font-size:15px;display:block}
.nm small{display:block;color:var(--mute);font-size:12px;margin-top:2px;font-weight:500}
.nbtn{margin-top:5px;border:2px dashed var(--ink);background:transparent;color:var(--ink);border-radius:999px;padding:1px 9px;font:700 11px "DM Sans",system-ui,sans-serif;cursor:pointer;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nbtn.has{border-style:solid;background:var(--sun);color:#111}
.qty{display:flex;align-items:center;gap:3px}
.qty button{width:34px;height:34px;border-radius:11px;border:var(--bw) solid var(--ink);background:var(--card);color:var(--ink);font:800 18px "DM Sans",system-ui,sans-serif;cursor:pointer}
.qty span{min-width:20px;text-align:center;font-weight:800}
.cta{position:sticky;bottom:calc(100px + env(safe-area-inset-bottom,0px));padding-top:12px;z-index:4}
.trip{background:var(--card);border:var(--bw) solid var(--ink);border-radius:24px;box-shadow:5px 5px 0 var(--shc);margin-top:16px;overflow:hidden}
.trh{width:100%;display:flex;justify-content:space-between;align-items:center;gap:10px;border:0;background:transparent;color:var(--ink);padding:15px;text-align:left;cursor:pointer}
.trh b{font:800 18px "Bricolage Grotesque",system-ui,sans-serif;display:block;letter-spacing:-.02em}
.trh small{color:var(--mute);font-size:13px;font-weight:500}
.st{flex:none;border-radius:999px;padding:3px 11px;font:800 12px "DM Sans",system-ui,sans-serif;border:2px solid var(--ink);color:#111}
.st.open{background:var(--lime)}.st.done{background:var(--sun)}
.tbody{padding:0 15px 15px}
.ir{display:flex;gap:10px;align-items:center;padding:8px 0;border-top:2px dashed var(--mute);font-size:14px}
.ir .y{color:var(--ink);font-weight:800;width:16px}
.ir .n{flex:1;min-width:0}
.ir .q{color:var(--mute)}
.ir .pz{font-weight:800}
.tacts{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:6px}
.stat{border:var(--bw) solid var(--ink);border-radius:22px;padding:14px;box-shadow:4px 4px 0 var(--shc);background:var(--c,var(--card));color:#111}
.stat small{display:block;font:700 12px "DM Sans",system-ui,sans-serif}
.stat b{display:block;font:800 28px/1.05 "Bricolage Grotesque",system-ui,sans-serif;letter-spacing:-.03em;margin:2px 0}
.stat.wide{grid-column:1/-1}
.chart{border:var(--bw) solid var(--ink);border-radius:24px;background:var(--card);padding:16px 12px 10px;box-shadow:5px 5px 0 var(--shc);margin:14px 0}
.bars{display:flex;align-items:flex-end;gap:8px;height:170px}
.bars .b{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px}
.bars .b i{display:block;width:100%;border:var(--bw) solid var(--ink);border-radius:10px 10px 4px 4px;background:var(--c);min-height:4px}
.bars .b span{font:800 11px "DM Sans",system-ui,sans-serif}
.bars .b em{font:700 11px "DM Sans",system-ui,sans-serif;font-style:normal;color:var(--mute);text-transform:uppercase}
.top{display:flex;align-items:center;gap:10px;background:var(--card);border:var(--bw) solid var(--ink);border-radius:16px;padding:8px 12px;margin-bottom:8px;box-shadow:3px 3px 0 var(--shc);font-weight:700;font-size:14px}
.top b{font:800 18px "Bricolage Grotesque",system-ui,sans-serif;width:22px}
.top span{flex:1;min-width:0}
.top em{font:800 12px "DM Sans",system-ui,sans-serif;font-style:normal;background:var(--ink);color:var(--bg);border-radius:999px;padding:1px 9px}
.tabs{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom,0px));width:min(440px,calc(100% - 20px));display:flex;gap:4px;padding:6px;background:var(--tbb);border:var(--bw) solid var(--ink);border-radius:26px;box-shadow:0 6px 0 var(--shc);z-index:10}
.tabs button{position:relative;flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 2px 7px;border:0;background:transparent;color:var(--tbf);border-radius:20px;font:800 11px "DM Sans",system-ui,sans-serif;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--lime);color:#111}
.tabs svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.badge{position:absolute;top:0;left:calc(50% + 6px);background:var(--tom);color:#111;border:2px solid #111;border-radius:999px;font-size:10px;font-weight:800;min-width:19px;padding:0 5px;text-align:center}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.55);opacity:0;pointer-events:none;transition:opacity .2s;z-index:20}
.ov.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:50%;bottom:0;transform:translate(-50%,100%);width:min(600px,100%);max-height:88vh;background:var(--bg);border:var(--bw) solid var(--ink);border-bottom:0;border-radius:28px 28px 0 0;z-index:30;display:flex;flex-direction:column;transition:transform .3s cubic-bezier(.2,.8,.2,1);padding-bottom:env(safe-area-inset-bottom,0px);visibility:hidden}
.sheet.open{transform:translate(-50%,0);visibility:visible}
.sh{display:flex;justify-content:space-between;align-items:center;padding:18px 20px 8px;gap:8px}
.sh h2{font:800 26px "Bricolage Grotesque",system-ui,sans-serif;margin:0;flex:1;letter-spacing:-.03em}
.x{border:var(--bw) solid var(--ink);background:var(--card);color:var(--ink);width:38px;height:38px;border-radius:12px;font-size:17px;font-weight:800;cursor:pointer;box-shadow:2px 2px 0 var(--shc)}
.jb{padding:8px 20px 24px;display:flex;flex-direction:column;gap:14px}
.jb p{margin:0;color:var(--mute);font-size:14px}
.jb .code{font:800 18px "DM Sans",system-ui,sans-serif;background:var(--sun);color:#111;border:var(--bw) solid var(--ink);border-radius:14px;padding:12px 14px;word-break:break-all;user-select:all}
.jrow{display:flex;gap:10px}
.jrow input{flex:1}
.toast{position:fixed;left:50%;bottom:calc(98px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(10px);background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:16px;font:800 14px "DM Sans",system-ui,sans-serif;z-index:50;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;white-space:nowrap;max-width:calc(100% - 24px);overflow:hidden;text-overflow:ellipsis;border:var(--bw) solid var(--bg)}
.toast.on{opacity:1;transform:translateX(-50%)}
.toast button{margin-left:10px;border:0;background:var(--lime);color:#111;border-radius:999px;padding:3px 12px;font:800 13px "DM Sans",system-ui,sans-serif;cursor:pointer}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ===== tema suave ===== */
body{font-weight:400}
h1{font-weight:700;font-size:38px;letter-spacing:-.035em;line-height:1}
.sub{display:block;background:none;border:0;padding:0;border-radius:0;transform:none;margin-top:8px;color:var(--mute);font-weight:500;font-size:13px}
.sync{border:1px solid var(--bd);background:var(--card);color:var(--mute);box-shadow:none;font-weight:600}
.sync i{width:8px;height:8px;border:0}
.sync.ok i{background:var(--good)}
.search input,.search select,.addc input,.addc select,.jrow input,.jb input,#noteIn{border:1px solid var(--bd);background:var(--card);box-shadow:none;border-radius:16px;font-weight:500}
.search input:focus,.search select:focus,.addc input:focus,.jb input:focus,#noteIn:focus{border-color:var(--acc);box-shadow:0 0 0 4px var(--acc-soft)}
.adding{border:0;background:var(--acc-soft);color:var(--ink);box-shadow:none;border-radius:16px;font-weight:600}
.adding .c{background:var(--acc);color:var(--onacc)}
.h2,.rhead h2,.sh h2,.empty b,.trh b,.gh,.pt b,.pr strong,.stat b,.cat b{font-weight:700}
.h2{background:none;font-size:19px;letter-spacing:-.02em;margin:24px 2px 12px}
.cats{gap:12px}
.cat{border:1px solid var(--bd);box-shadow:none;border-radius:24px;background:color-mix(in srgb,var(--c) 20%,var(--card));aspect-ratio:1.3;transform:none;color:var(--ink)}

const EMO=[[/cabello|pelo/,"💇"],[/aceite|especia|salsa/,"🫒"],[/agua|refresc/,"🥤"],[/aperitiv/,"🥨"],[/arroz|legumbre|pasta/,"🍝"],[/azucar|caramelo|chocolate/,"🍫"],[/bebe/,"🍼"],[/bodega|vino|cerveza/,"🍷"],[/cacao|cafe|infusion/,"☕"],[/carne/,"🥩"],[/cereal|galleta/,"🥣"],[/charcuter|queso/,"🧀"],[/congelad/,"🧊"],[/conserva|caldo/,"🥫"],[/facial|corporal|higiene/,"🧴"],[/fitoterap|parafarm/,"💊"],[/fruta|verdura/,"🥦"],[/huevo|leche|mantequilla/,"🥛"],[/limpieza|hogar/,"🧽"],[/maquillaje/,"💄"],[/marisco|pescado/,"🐟"],[/mascota/,"🐶"],[/panader|pasteler/,"🥐"],[/pizza|plato/,"🍕"],[/postre|yogur/,"🍮"],[/zumo/,"🧃"],[/otros/,"✍️"]];

function confetti(){
  if(matchMedia("(prefers-reduced-motion:reduce)").matches)return;
  const c=document.createElement("canvas");c.style.cssText="position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:60";
  document.body.appendChild(c);
  const W=c.width=innerWidth,H=c.height=innerHeight,x=c.getContext("2d");
  const ps=Array.from({length:100},()=>({x:W/2,y:H*.72,vx:(Math.random()-.5)*15,vy:-Math.random()*17-6,s:7+Math.random()*8,r:Math.random()*6,vr:(Math.random()-.5)*.4,c:PAL[Math.random()*7|0]}));
  let f=0;
  (function loop(){
    x.clearRect(0,0,W,H);
    ps.forEach(p=>{p.vy+=.45;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.strokeStyle="#111";x.lineWidth=1.5;x.fillRect(-p.s/2,-p.s/3,p.s,p.s*.66);x.strokeRect(-p.s/2,-p.s/3,p.s,p.s*.66);x.restore()});
    if(++f<100)requestAnimationFrame(loop);else c.remove();
  })();
}

// ---------- modelo de listas
const activeTrip=()=>trips.find(t=>t.id===active&&t.status==="open")||trips.find(t=>t.status==="open")||null;
function snap(p){return {n:p.n,b:p.b,f:p.f,p:p.p,i:p.i,gn:CAT.grupos[p.g]||""}}
function info(t,id){
  const it=(tripItems[t.id]||{})[id],live=t.status==="open"?byId[id]:null,s=(it&&it.s)||{};
  return live?{n:live.n,b:live.b,f:live.f,p:live.p,i:live.i,gn:CAT.grupos[live.g]||s.gn||"",c:0}
             :{n:s.n||"Producto",b:s.b||"",f:s.f||"",p:s.p||0,i:s.i||"",gn:s.gn||"",c:s.c||0};
}
function total(t){return Object.keys(tripItems[t.id]||{}).reduce((a,id)=>a+tripItems[t.id][id].q*info(t,id).p,0)}
function newTrip(){

function removeItem(t,id){

function finish(id){
  const t=trips.find(x=>x.id===id);if(!t)return;
  const its=tripItems[id]||{},ids=Object.keys(its),left=ids.filter(i=>!its[i].d).length;
  if(!confirm(left?`Quedan ${left} producto${left>1?"s":""} sin tachar. ¿Dar la compra por hecha igualmente?`:"¿Dar esta compra por hecha? Pasará a Listas."))return;
  const prev={},now=new Date().toISOString();
  ids.forEach(pid=>{
    if(pid[0]==="c")return;
    const i=info(t,pid),h=habits[pid];prev[pid]=h?{...h}:null;
    habits[pid]={times:(h?h.times:0)+1,last_price:i.p,last_at:now,s:{n:i.n,b:i.b,f:i.f,p:i.p,i:i.i,gn:i.gn}};
    push("h|"+pid);
  });
  t.total=Math.round(total(t)*100)/100;t.n=ids.length;t.status="done";t.done_at=now;if(active===id)active=null;
  rev++;push("t|"+id);persist();renderAll();confetti();

    const tt=trips.find(x=>x.id===id);if(!tt)return;
    tt.status="open";tt.done_at=null;tt.total=null;tt.n=null;active=id;
    for(const pid in prev){if(prev[pid])habits[pid]=prev[pid];else delete habits[pid];push("h|"+pid)}
    rev++;push("t|"+id);persist();renderAll();
  });
}
function reopen(id){const t=trips.find(x=>x.id===id);if(!t)return;t.status="open";t.done_at=null;active=id;rev++;push("t|"+id);persist();renderAll();go("list")}
function useTrip(id){active=id;persist();go("list")}
function delTrip(id){
  if(!confirm("¿Borrar esta lista para siempre?"))return;
  trips=trips.filter(t=>t.id!==id);delete tripItems[id];exp.delete(id);if(active===id)active=null;
  rev++;push("t|"+id);persist();renderAll();

async function repeat(id){
  await ensureItems([id]);
  const src=tripItems[id]||{},t=newTrip(),dst=tripItems[t.id];
  for(const pid in src){dst[pid]={q:src[pid].q,d:false,s:src[pid].s,note:src[pid].note||""};push("i|"+t.id+"|"+pid)}

}

// ---------- orden de secciones del súper
function orderFull(){
  const base=CAT.grupos.slice(),o=(prefs.orden||[]).filter(g=>base.includes(g)||g==="Otros");
  const full=[...o,...base.filter(g=>!o.includes(g))];
  if(!full.includes("Otros"))full.push("Otros");
  return full;
}
function groupsOf(t){
  const its=tripItems[t.id]||{},gs={},full=orderFull();
  Object.keys(its).forEach(id=>{const g=info(t,id).gn||"Otros";(gs[g]||(gs[g]=[])).push(id)});
  return Object.keys(gs).sort((a,b)=>{const x=full.indexOf(a),y=full.indexOf(b);return (x<0?999:x)-(y<0?999:y)||a.localeCompare(b,"es")})
    .map(g=>[g,gs[g].sort((a,b)=>(its[a].d?1:0)-(its[b].d?1:0)||info(t,a).n.localeCompare(info(t,b).n,"es"))]);
}
function moveGroup(g,dir){
  const t=activeTrip();if(!t)return;
  const vis=groupsOf(t).map(x=>x[0]),k=vis.indexOf(g),n=vis[k+dir];if(k<0||!n)return;
  const full=orderFull(),a=full.indexOf(g),b=full.indexOf(n);
  [full[a],full[b]]=[full[b],full[a]];prefs.orden=full;rev++;push("p|orden");persist();renderAll();
}

// ---------- sincronización (Supabase)
async function run(key){
  const [k,a,b]=key.split("|");
  if(k==="t"){
    const t=trips.find(x=>x.id===a);
    if(t)return sb.from("trips").upsert({list_id:code,id:t.id,name:t.name,status:t.status,created_at:t.created_at,done_at:t.done_at||null,total:t.total,n:t.n});
    const r=await sb.from("trip_items").delete().eq("list_id",code).eq("trip_id",a);
    if(r.error)return r;
    return sb.from("trips").delete().eq("list_id",code).eq("id",a);
  }
  if(k==="p")return prefs[a]!==undefined?sb.from("prefs").upsert({list_id:code,k:a,v:prefs[a]}):sb.from("prefs").delete().eq("list_id",code).eq("k",a);
  if(k==="h"){const h=habits[a];return h?sb.from("habits").upsert({list_id:code,product_id:a,times:h.times,last_price:h.last_price,last_at:h.last_at,snap:h.s||{}}):sb.from("habits").delete().eq("list_id",code).eq("product_id",a)}
  const it=(tripItems[a]||{})[b];
  if(it)return sb.from("trip_items").upsert({list_id:code,trip_id:a,product_id:b,qty:it.q,done:it.d,note:it.note||null,snap:it.s||{},updated_at:new Date().toISOString()});
  return sb.from("trip_items").delete().eq("list_id",code).eq("trip_id",a).eq("product_id",b);
}
async function push(key){
  if(!sb||!code)return;
  pending++;let err=null;
  try{const r=await run(key);err=r&&r.error}catch(e){err=e}
  pending--;
  if(err){queue.add(key);persist();setSync("off");return}
  queue.delete(key);persist();setSync("ok");
  if(!pending)pull();
}
async function flush(){await Promise.all([...queue].map(push))}
const rowItem=r=>({q:r.qty,d:r.done,s:r.snap||{},note:r.note||""});
const ITEM_COLS="trip_id,product_id,qty,done,snap,note";
async function pull(){
  if(!sb||!code||pending)return;
  if(queue.size){await flush();return}
  const r0=rev;
  try{
    const t=await sb.from("trips").select("id,name,status,created_at,done_at,total,n").eq("list_id",code).order("created_at",{ascending:false}).limit(80);
    if(t.error)throw t.error;
    const ts=t.data,ids=new Set(ts.map(x=>x.id));
    const want=new Set(ts.filter(x=>x.status==="open").map(x=>x.id));
    const ld=ts.find(x=>x.status==="done");if(ld)want.add(ld.id);
    exp.forEach(id=>{if(ids.has(id))want.add(id)});
    const keep=[...want];let rows=[];
    if(keep.length){const it=await sb.from("trip_items").select(ITEM_COLS).eq("list_id",code).in("trip_id",keep);if(it.error)throw it.error;rows=it.data}
    const pr=await sb.from("prefs").select("k,v").eq("list_id",code);
    const hb=await sb.from("habits").select("product_id,times,last_price,last_at,snap").eq("list_id",code).order("times",{ascending:false}).limit(300);
    if(r0!==rev||pending||queue.size)return;
    const ti={};for(const id in tripItems)if(ids.has(id))ti[id]=tripItems[id];
    keep.forEach(id=>ti[id]={});
    rows.forEach(r=>ti[r.trip_id][r.product_id]=rowItem(r));
    trips=ts;tripItems=ti;
    if(!pr.error){const p={};pr.data.forEach(x=>p[x.k]=x.v);prefs=p}
    if(!hb.error){const h={};hb.data.forEach(x=>h[x.product_id]={times:x.times,last_price:Number(x.last_price)||0,last_at:x.last_at,s:x.snap||{}});habits=h}
    persist();renderAll();setSync("ok");
  }catch(e){setSync("off")}
}
async function ensureItems(ids){
  if(!sb||!code)return;
  const need=ids.filter(i=>!tripItems[i]&&!loading.has(i));if(!need.length)return;
  need.forEach(i=>loading.add(i));
  try{
    const r=await sb.from("trip_items").select(ITEM_COLS).eq("list_id",code).in("trip_id",need);
    if(r.error)throw r.error;
    need.forEach(i=>{if(!tripItems[i])tripItems[i]={}});
    r.data.forEach(x=>tripItems[x.trip_id][x.product_id]=rowItem(x));
    persist();
  }catch(e){}
  need.forEach(i=>loading.delete(i));renderAll();
}
function startSync(){
  if(!sb||!code){setSync("local");return}
  pull();
  if(chan)sb.removeChannel(chan);
  chan=sb.channel("compra")
    .on("postgres_changes",{event:"*",schema:"public",table:"trips"},()=>pull())
    .on("postgres_changes",{event:"*",schema:"public",table:"trip_items"},()=>pull())
    .on("postgres_changes",{event:"*",schema:"public",table:"prefs"},()=>pull())
    .subscribe(s=>{if(s==="SUBSCRIBED")setSync("ok");else if(["CHANNEL_ERROR","TIMED_OUT","CLOSED"].includes(s))setSync("off")});
}
const validCode=c=>/^[\w-]{8,64}$/.test(c);
function useCode(c,keepLocal){
  code=c;store("code",c);
  if(keepLocal){
    trips.forEach(t=>{push("t|"+t.id);Object.keys(tripItems[t.id]||{}).forEach(p=>push("i|"+t.id+"|"+p))});
    Object.keys(habits).forEach(id=>push("h|"+id));Object.keys(prefs).forEach(k=>push("p|"+k));
  }else{trips=[];tripItems={};habits={};prefs={};active=null;queue=new Set();persist();renderAll()}
  startSync();toast("Lista conectada");
}

}
function waText(t){
  const its=tripItems[t.id]||{};
  let s=`🛒 *${t.name}*\n`;
  groupsOf(t).forEach(([g,l])=>{
    s+=`\n${emo(g)} *${g}*\n`+l.map(id=>{const it=its[id],i=info(t,id);return `• ${it.q>1?it.q+"× ":""}${i.n}${it.note?" ("+it.note+")":""}${it.d?" ✅":""}`}).join("\n")+"\n";
  });
  return s+`\nTotal estimado: ${eur(total(t))}`;
}

// ---------- listas anteriores
function renderTrips(){
  if(!trips.length){$("trips").innerHTML=empty("🗓️","Aún no hay listas","Cuando hagas tu primera compra aparecerá aquí.","");return}
  $("trips").innerHTML=trips.map(t=>{
    const its=tripItems[t.id],ids=its?Object.keys(its):[],open=exp.has(t.id);
    const cnt=its?ids.length:t.n,tot=its&&t.status==="open"?total(t):(t.total!=null?t.total:(its?total(t):null));
    const meta=cnt!=null&&tot!=null?`${t.status==="done"&&t.done_at?"Hecha el "+fecha(t.done_at)+" · ":""}${cnt} producto${cnt===1?"":"s"} · ${eur(tot)}`:"Toca para ver";
    let body="";
    if(open){
      body=`<div class="tbody">`+(its?ids.map(id=>{const i=info(t,id),it=its[id];return `<div class="ir"><span class="y">${it.d?"✓":""}</span><span class="n">${esc(i.n)}${it.note?` <small>(${esc(it.note)})</small>`:""}</span><span class="q">×${it.q}</span><span class="pz">${eur(i.p*it.q)}</span></div>`}).join(""):`<p>Cargando…</p>`)+
        `<div class="tacts">`+(t.status==="open"?`<button class="btn pri" data-use="${t.id}">Abrir esta lista</button>`:`<button class="btn pri" data-repeat="${t.id}">Repetir esta compra</button><button class="btn" data-reopen="${t.id}">Reabrir</button>`)+`<button class="btn ghost" data-del="${t.id}">Borrar</button></div></div>`;
    }
    return `<div class="trip"><button class="trh" data-exp="${t.id}" aria-expanded="${open}"><span><b>${esc(t.name)}</b><small>${meta}</small></span><span class="st ${t.status}">${t.status==="open"?"En curso":"Hecha"}</span></button>${body}</div>`;
  }).join("");
}

// ---------- gasto
const monthKey=d=>{const x=new Date(d);return x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0")};
const mname=k=>new Date(k+"-01T12:00:00").toLocaleDateString("es-ES",{month:"short"}).replace(".","");
function renderSpend(){
  const done=trips.filter(t=>t.status==="done"&&t.total!=null);
  if(!done.length){$("spend").innerHTML=empty("📈","Aún no hay gasto que enseñar","Cuando des por hecha tu primera compra verás aquí cuánto os gastáis cada mes.","");return}
  const by={};done.forEach(t=>{const k=monthKey(t.done_at||t.created_at);(by[k]||(by[k]={s:0,n:0}));by[k].s+=Number(t.total);by[k].n++});
  const now=new Date(),keys=[];for(let i=5;i>=0;i--)keys.push(monthKey(new Date(now.getFullYear(),now.getMonth()-i,1)));
  const vals=keys.map(k=>by[k]?by[k].s:0),max=Math.max(...vals,1),cur=vals[5],prev=vals[4];
  const all=done.reduce((a,t)=>a+Number(t.total),0),avg=all/done.length;
  const pct=prev>0?Math.round((cur-prev)/prev*100):null;
  const top=Object.keys(habits).sort((a,b)=>habits[b].times-habits[a].times).slice(0,5);
  $("spend").innerHTML=`<div class="stats">
    <div class="stat wide" style="--c:var(--lime)"><small>Este mes</small><b>${eur(cur)}</b><small>${by[keys[5]]?by[keys[5]].n+" compra"+(by[keys[5]].n>1?"s":""):"Sin compras todavía"}${pct!==null?` · ${pct>=0?"▲":"▼"} ${Math.abs(pct)} % vs ${mname(keys[4])}`:""}</small></div>
    <div class="stat" style="--c:var(--sun)"><small>Media por compra</small><b>${eur(avg)}</b></div>
    <div class="stat" style="--c:#FF9ECF"><small>Compras hechas</small><b>${done.length}</b></div></div>
    <div class="chart"><div class="bars">${vals.map((v,i)=>`<div class="b"><span>${v?Math.round(v)+" €":""}</span><i style="height:${Math.max(v/max*100*.82,2)}%;--c:${i===5?"var(--tom)":PAL[(i+2)%7]}"></i><em>${mname(keys[i])}</em></div>`).join("")}</div></div>`+
    (top.length?`<h2 class="h2">Lo que más compráis</h2>`+top.map((id,k)=>`<div class="top"><b>${k+1}</b><span>${esc((byId[id]&&byId[id].n)||habits[id].s.n||"Producto")}</span><em>×${habits[id].times}</em></div>`).join(""):"");
}

// ---------- navegación y renderizado
function renderHead(){
  if(tab==="prod"){$("title").textContent="Compra";$("sub").textContent=CAT.productos.length?`${CAT.actualizado?"Catálogo "+fecha(CAT.actualizado+"T12:00:00")+" · ":""}${CAT.productos.length.toLocaleString("es-ES")} productos`:"Cargando…"}
  else if(tab==="list"){const t=activeTrip();$("title").textContent="Lista";$("sub").textContent=t?t.name:"Sin lista en curso"}
  else if(tab==="hist"){$("title").textContent="Listas";$("sub").textContent="Una por cada compra"}
  else{$("title").textContent="Gasto";$("sub").textContent="Cuánto os cuesta el súper"}
}
function renderAll(){
  renderHead();renderAdding();renderMinis();renderList();renderTrips();if(tab==="spend")renderSpend();syncCards();
  const t=activeTrip(),n=t?Object.keys(tripItems[t.id]||{}).length:0;
  $("badge").hidden=!n;$("badge").textContent=n;
}
function go(n){
  tab=n;reorder=false;
  TABS.forEach(x=>{$("v-"+x).hidden=x!==n;document.querySelector(`.tabs [data-tab="${x}"]`).setAttribute("aria-selected",x===n)});
  scrollTo(0,0);renderAll();
  if(n==="hist")ensureItems(trips.slice(0,12).map(t=>t.id));
}

// ---------- eventos
function changeQty(id,d){
  const t=activeTrip(),its=t&&tripItems[t.id];if(!its||!its[id])return;
  if(its[id].q+d<1)return removeItem(t,id);
  its[id].q+=d;rev++;push("i|"+t.id+"|"+id);persist();renderAll();
}
document.addEventListener("click",e=>{
  const T=e.target;let b;
  if(T.closest("#undo")){const f=undoFn;undoFn=null;$("toast").classList.remove("on");if(f)f();return}
  if(b=T.closest("[data-id]"))return toggleProd(b.dataset.id,b);
  if(b=T.closest("[data-tab]"))return go(b.dataset.tab);
  if(b=T.closest("[data-g]")){grupo=+b.dataset.g;showMode();return scrollTo(0,0)}
  if(b=T.closest("[data-m]"))return changeQty(b.dataset.m,-1);
  if(b=T.closest("[data-a]"))return changeQty(b.dataset.a,1);
  if(b=T.closest("[data-note]")){const t=activeTrip(),id=b.dataset.note,it=t&&(tripItems[t.id]||{})[id];if(!it)return;noteFor=id;$("noteT").textContent=info(t,id).n;$("noteIn").value=it.note||"";openSheet("note");setTimeout(()=>$("noteIn").focus(),320);return}
  if(b=T.closest("[data-p]")){const t=activeTrip(),its=t&&tripItems[t.id],id=b.dataset.p;if(!its||!its[id])return;its[id].d=!its[id].d;rev++;push("i|"+t.id+"|"+id);persist();return renderAll()}
  if(b=T.closest("[data-up]"))return moveGroup(b.dataset.up,-1);
  if(b=T.closest("[data-dn]"))return moveGroup(b.dataset.dn,1);
  if(b=T.closest("[data-finish]"))return finish(b.dataset.finish);
  if(b=T.closest("[data-go]"))return go(b.dataset.go);
  if(b=T.closest("[data-newtrip]")){newTrip();persist();renderAll();return go("prod")}
  if(b=T.closest("[data-addc]")){addCustom(term.trim(),"Otros");toast("Añadido a la lista");return}
  if(b=T.closest("[data-exp]")){const id=b.dataset.exp;exp.has(id)?exp.delete(id):exp.add(id);renderTrips();if(exp.has(id))ensureItems([id]);return}
  if(b=T.closest("[data-use]"))return useTrip(b.dataset.use);
  if(b=T.closest("[data-repeat]"))return repeat(b.dataset.repeat);
  if(b=T.closest("[data-reopen]"))return reopen(b.dataset.reopen);
  if(b=T.closest("[data-del]"))return delTrip(b.dataset.del);
});
document.addEventListener("keydown",e=>{if((e.key==="Enter"||e.key===" ")&&e.target.matches&&e.target.matches(".row")){e.preventDefault();e.target.click()}});
$("back").onclick=()=>{grupo=-1;marca="";term="";$("q").value="";$("marca").value="";showMode();scrollTo(0,0)};
$("q").addEventListener("input",e=>{term=e.target.value;showMode()});
$("marca").addEventListener("change",e=>{marca=e.target.value;showMode()});
$("adding").onclick=()=>go("list");
$("newTrip").onclick=()=>{newTrip();persist();renderAll();go("prod");toast("Lista nueva creada")};
$("reord").onclick=()=>{reorder=!reorder;renderAll()};
$("wa").onclick=()=>{const t=activeTrip();if(t)window.open("https://wa.me/?text="+encodeURIComponent(waText(t)),"_blank")};
$("addc").addEventListener("submit",e=>{e.preventDefault();const n=$("cname").value.trim();if(!n)return;addCustom(n,$("csec").value);$("cname").value="";toast("Añadido")});
$("sync").onclick=showJoin;
$("ov").onclick=closeSheets;
document.querySelectorAll("[data-close]").forEach(b=>b.onclick=closeSheets);
function saveNote(v){
  const t=activeTrip(),it=t&&(tripItems[t.id]||{})[noteFor];
  if(it){it.note=v.trim();rev++;push("i|"+t.id+"|"+noteFor);persist();renderAll()}
  closeSheets();
}
$("noteOk").onclick=()=>saveNote($("noteIn").value);
$("noteClr").onclick=()=>saveNote("");
$("noteIn").addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();saveNote($("noteIn").value)}});
$("jbody").addEventListener("click",e=>{
  const id=e.target.id;
  if(id==="jnew"){useCode(uid()+uid(),true);showJoin()}
  if(id==="jgo"){const c=$("jcode").value.trim();if(!validCode(c))return toast("Código no válido");useCode(c,false);closeSheets()}
  if(id==="jshare")share();
});
addEventListener("online",pull);
document.addEventListener("visibilitychange",()=>{if(!document.hidden)pull()});

// ---------- arranque
if(CFG.SUPABASE_URL&&CFG.SUPABASE_KEY&&window.supabase){sb=supabase.createClient(CFG.SUPABASE_URL,CFG.SUPABASE_KEY)}
if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
setSync(sb&&code?"off":"local");
renderAll();
fetch("catalogo.json").then(r=>{if(!r.ok)throw 0;return r.json()}).then(d=>{
  CAT=d;for(const p of d.productos){byId[p.id]=p;p.k=norm(p.n+" "+p.b)}
  const cuenta={};for(const p of d.productos)if(p.b)cuenta[p.b]=(cuenta[p.b]||0)+1;
  const ms=Object.keys(cuenta).sort((a,b)=>(b==="Hacendado")-(a==="Hacendado")||cuenta[b]-cuenta[a]||a.localeCompare(b,"es"));
  $("marca").innerHTML=`<option value="">Marcas</option>`+ms.map(x=>`<option value="${esc(x)}">${esc(x)} (${cuenta[x]})</option>`).join("");
  renderCats();showMode();renderAll();startSync();
  if(!code&&sb&&!load("sinLista",false)){store("sinLista",true);showJoin()}
}).catch(()=>{$("sub").textContent="Sin catálogo";$("landing").innerHTML=`<div class="empty">Falta catalogo.json.<br>Lanza la acción "Actualizar catálogo" en GitHub.</div>`});

// barra inferior: se esconde al bajar y vuelve al subir o al llegar al final
(function(){let ly=0;const tb=document.querySelector(".tabs");
addEventListener("scroll",()=>{const y=scrollY,bottom=innerHeight+y>=document.documentElement.scrollHeight-60;
if(y<60||bottom||y<ly-4)tb.classList.remove("hide");else if(y>ly+4)tb.classList.add("hide");ly=y},{passive:true})})();
</script>
