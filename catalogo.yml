name: Actualizar catálogo
on:
  schedule:
    - cron: "0 5 * * 1"   # cada lunes, 05:00 UTC (06:00-07:00 en Sevilla)
  workflow_dispatch:       # botón "Run workflow" para lanzarlo a mano
permissions:
  contents: write
jobs:
  catalogo:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/fetch_catalog.mjs
      - run: |
          git config user.name "catalogo-bot"
          git config user.email "bot@users.noreply.github.com"
          git add catalogo.json
          git diff --staged --quiet || (git commit -m "Catálogo $(date +%F)" && git push)
